set -g default-terminal "tmux-256color"
# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc,*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -s extended-keys on
set -g status-position top

# my tmux toolchain:
#
# tpm - to manage tmux plugins
# tmux-sensible for sensible defaults
# tmux-resurrect for persisting sessions to disk so I can re-attach after reboot
# tmux-continuum for auto-saving every 15 minutes with tmux-resurrect
# tmux-yank for copying to the system clipboard from tmux copy-mode
# tmux-thumbs for activating "hints" mode for quick copying
#
# status bar:
#
# tmux-mode-indicator to show current tmux mode (normal, copy, etc)
# catppuccin/tmux for theming and status pills
# 
# cli binaries:
#
# sesh - go cli for finding/attaching to sessions
# smug - go cli for templating complex sessions with multiple windows/panes

# Toggle synchronized panes in the current window
bind b setw synchronize-panes \; display-message "sync-panes: #{?pane_synchronized,on,off}"


# --== tmux Plugin Manager ==--
# Keep TPM's cloned plugin repos outside this dotfiles git worktree.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.local/share/tmux/plugins/'
if-shell '[ ! -d "$HOME/.local/share/tmux/plugins/tpm" ] && command -v git >/dev/null 2>&1' \
  'run-shell "mkdir -p \"$HOME/.local/share/tmux/plugins\" && git clone --depth=1 https://github.com/tmux-plugins/tpm \"$HOME/.local/share/tmux/plugins/tpm\""'
set -g @plugin 'tmux-plugins/tpm'

# TPM tmux-plugins


# --== tmux-sensible ==--
set -g @plugin 'tmux-plugins/tmux-sensible'  # sensible defaults
# What tmux-sensible sets automatically (override any of these before the run line):
set -s escape-time 0            # no vim mode-switching delay
set -g history-limit 50000      # bigger scrollback buffer (from 2000)
set -g display-time 4000        # show messages for 4s (from 750ms)
set -g status-interval 5        # refresh status bar every 5s (from 15s)
#set -g default-terminal "screen-256color"
set -g status-keys emacs        # emacs keys in command prompt
set -g focus-events on          # pass focus events through to apps
setw -g aggressive-resize on    # better resize in grouped sessions


# --== tmux-resurrect ==--
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist sessions to disk
# --- Optional: restore Neovim/Vim sessions (requires vim-obsession) ---
#set -g @resurrect-strategy-nvim 'session'
#set -g @resurrect-strategy-vim 'session'

# --- Optional: restore pane contents (scrollback) ---
set -g @resurrect-capture-pane-contents 'on'

# --- Optional: change where save files are stored (default: ~/.tmux/resurrect) ---
#set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# --- Optional: restore additional programs beyond the defaults ---
# Defaults already include: vi vim nvim emacs man less more tail top htop
#set -g @resurrect-processes '"~npm start" "~go run ."'

# --- Optional: disable restoring specific programs ---
#set -g @resurrect-processes ':all:'   # restore everything
#set -g @resurrect-processes 'false'   # restore nothing (layout only)


# --== tmux-yank ==--
set -g @plugin 'tmux-plugins/tmux-yank'

# --- Which clipboard to target (Linux X11 only) ---
# 'clipboard' = Ctrl+V clipboard (default)
# 'primary'   = middle-click clipboard
# 'secondary' = rare third clipboard
set -g @yank_selection 'clipboard'

# For Linux, you can also set the clipboard used in copy-mode separately:
set -g @yank_selection_mouse 'clipboard'

# --- Behavior after yanking ---
# 'copy-pipe-and-cancel' = yank then EXIT copy-mode (default)
# 'copy-pipe'            = yank but STAY in copy-mode (useful for yanking multiple things)
set -g @yank_action 'copy-pipe-and-cancel'

# --- Mouse drag to copy ---
# 'on'  = yank to clipboard when you release a mouse drag selection
# 'off' = disable mouse yank (default)
set -g @yank_with_mouse 'off'


# --== tmux-mode-indicator ==--
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
# Label text for each mode
set -g @mode_indicator_prefix_prompt ' C-a  '
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_empty_prompt ' TMUX '
# Colors for each mode
set -g @mode_indicator_prefix_mode_style 'bg=red,fg=black'
set -g @mode_indicator_copy_mode_style 'bg=yellow,fg=black'
set -g @mode_indicator_sync_mode_style 'bg=blue,fg=black'
set -g @mode_indicator_empty_mode_style 'bg=cyan,fg=black'
# Note: status-left (where the indicator renders) is set in the catppuccin
# section below so all status-bar config lives in one place.



# --== tmux-sessionx ==--
set -g @plugin 'omerxx/tmux-sessionx'        # fuzzy session manager

# --- Trigger key (default: prefix + O) ---
set -g @sessionx-bind 'o'

# --- Disable requiring the prefix before the bind key ---
#set -g @sessionx-prefix 'off'   # bind 'o' directly without prefix

# --- Window size of the popup ---
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

# --- Preview pane position ---
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'

# --- Disable preview entirely ---
#set -g @sessionx-preview-enabled 'false'

# --- Additional paths always shown in results (comma-separated) ---
set -g @sessionx-custom-paths '~/code/github.com/SwarmCast,~/code/github.com/GridSwarm,~/code/github.com/GrainBin,~/code/github.com/the-sarge,~/.dotfiles'

# --- Use zoxide's top results as additional entries ---
#set -g @sessionx-zoxide-mode 'on'

# --- Path scanned by Ctrl-X inside sessionx (default: ~/.config) ---
set -g @sessionx-x-path '~/.dotfiles'

# --- Filter out current session from the list ---
set -g @sessionx-filter-current 'false'

# --- Show only tmux sessions (hide zoxide/directory suggestions) ---
set -g @sessionx-tmux-mode 'on'

# --- fzf layout direction ---
set -g @sessionx-layout 'reverse'

# --- Tab completion: jump to window inside selected session ---
set -g @sessionx-bind-tab 'tab'

# --- Additional fzf options (passed directly to fzf-tmux) ---
set -g @sessionx-additional-options "--color=spinner:#f5e0dc"



# --== THEME: catppuccin/tmux ==--
set -g @plugin 'catppuccin/tmux'              # theming
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
if-shell '[ -x "$HOME/.local/share/tmux/plugins/tpm/bin/install_plugins" ] && [ ! -d "$HOME/.local/share/tmux/plugins/tmux-sensible" ]' \
  'run-shell "$HOME/.local/share/tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1"'
if-shell 'test -f "$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux"' \
  'run "$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux"'


# Status bar (single source of truth — must come AFTER the catppuccin run line)
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 200

# Left: mode indicator + session
set -g status-left "#{tmux_mode_indicator} "
set -ag status-left "#{E:@catppuccin_status_session}"

# Center: catppuccin window list shows window names via #W

# Right: command + folder + host
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_host}"


# --== tmux-continuum ==--  *must be the last-loaded plugin before the run line
set -g @plugin 'tmux-plugins/tmux-continuum' # use tmux-resurrect to auto-save every 15 min
# tmux-resurrect MUST come before tmux-continuum
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Save interval in minutes (default: 15) ---
#set -g @continuum-save-interval '15'
# --- Disable auto-saving without removing the plugin ---
#set -g @continuum-save-interval '0'

# --- Auto-restore last saved environment when tmux starts ---
#set -g @continuum-restore 'on'

# --- Auto-boot: start tmux automatically on system login (macOS/Linux) ---
#set -g @continuum-boot 'on'
#set -g @continuum-boot-options 'iterm'   # macOS: 'iterm' or 'terminal' or 'alacritty'
#set -g @continuum-boot-options 'fullscreen'  # Linux



# --- Show save status in status bar ---
# Add #{continuum_status} to your status-right to see last save time
#set -g status-right '#{continuum_status} | %H:%M'

# keep at the end of file
if-shell 'test -x "$HOME/.local/share/tmux/plugins/tpm/tpm"' \
  'run "$HOME/.local/share/tmux/plugins/tpm/tpm"'
